[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route the client's /api/* calls to serverless functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback: everything else serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
